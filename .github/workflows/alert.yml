name: NSE Stock Alert Tool

on:
  schedule:
    # Runs every 15 minutes between 3:00 AM and 10:45 AM UTC (Mon-Fri)
    # This covers 8:30 AM to 4:15 PM IST
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch: # Allows manual triggering

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    
    # We need permission to commit back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip' # caching pip dependencies for speed

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and push state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          # Only commit and push if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update state.json" && git push)
